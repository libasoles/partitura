name: Deploy

# El build corre acá y Netlify solo recibe dist/ ya armado (no consume minutos de build de Netlify).
# Requiere los secrets NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID, y los builds automáticos de Netlify desactivados.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Publicar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --no-build --dir=dist --message "${GITHUB_SHA::7} ${{ github.event.head_commit.message }}"
